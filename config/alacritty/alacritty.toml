#import = [
#  "~/.config/alacritty/themes/themes/solarized_dark.toml",
#]

import =[
  "~/.config/alacritty/themes/themes/tokyo-night.html"
]

[env]
TERM = "xterm-256color"

[window]
padding.x = 16
padding.y = 14
decorations = "None"
opacity = 1.0

[font]
size = 12.0

[font.bold]
family = "Berkeley Mono"
style = "Bold"

[font.bold_italic]
family = "Berkeley Mono"
style = "Bold Italic"

[font.italic]
family = "Berkeley Mono"
style = "Italic"

[font.normal]
family = "Berkeley Mono"
style = "Regular"

# Shift+Enter -> ESC CR, so Claude Code (and other TUI prompts) insert a newline
# instead of submitting. Enter and Shift+Enter both send a bare carriage return --
# the modifier isn't carried in the VT100 wire protocol -- so the meta-prefixed
# form is the escape hatch. Written by Claude Code's /terminal-setup (see the
# .bak backup alongside this file).
#   https://code.claude.com/docs/en/terminal-config#enter-multiline-prompts
#   https://blog.fsck.com/agent-blog/2026/02/26/terminal-keyboard-protocol/
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
