# Symlink into place:
#   ln -s ~/dotfiles/tmux.conf ~/.tmux.conf

# Prefix reachable entirely with the left hand: ctrl on the pinky, space on
# the thumb. Costs only set-mark in readline/emacs, and evil-mode's `v`
# covers the emacs side. Double-tap to send a literal C-Space through.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Swap the big left pane with the top-right one, whichever pane is focused.
# Indices track layout position, so the cells keep their geometry and the
# same key swaps back. -d keeps focus where it is. This displaces the default
# rename-window, still reachable via the `<` window menu.
bind , swap-pane -d -s .0 -t .1

# vim motions for pane focus, and shifted for resizing. -r makes them
# repeatable within repeat-time, matching the default arrow-key binds (which
# stay bound). `l` displaces last-window and `L` displaces switch-client -l.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# last-window, relocated here because `l` above took its default key.
bind Tab last-window

# Mouse scroll, pane select/resize, and window select via the status line.
set -g mouse on

# Pass terminal focus in/out through to programs inside tmux, so vim's
# FocusGained/FocusLost (autoread, etc.) fire.
set -g focus-events on

# Advertise 256 colours + truecolour so the terminal keeps its own $TERM
# capabilities (mouse reporting included) inside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# Scroll into history rather than sending arrow keys to the shell, and give
# the buffer enough room to scroll back through.
set -g history-limit 50000
